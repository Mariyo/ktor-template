org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
# Incubating: lets independent tasks configure concurrently on a configuration-cache miss.
org.gradle.configuration-cache.parallel=true
# Two dev-loop daemons run side by side (dev: watch + dev: server); 2g each would starve the container.
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m
org.gradle.daemon.idletimeout=1800000
kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=384m
kotlin.code.style=official
